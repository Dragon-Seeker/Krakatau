# Builds the browser package and publishes it to npm, which jsDelivr serves automatically:
#   https://cdn.jsdelivr.net/npm/krakatau-web@<version>/krak-client.mjs
#
# Release: push a tag like  web-v1.2.0   (the version is taken from the tag)
# Every push / PR also builds and runs the smoke test, without publishing.
name: web

on:
  push:
    branches: [master, main]
    tags: ['web-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYODIDE_VERSION: 314.0.7   # keep in sync with DEFAULT_PYODIDE in web/public/krak.worker.mjs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The JDK is only used to generate header-only stub classes (and compile the smoke test);
      # its version decides which JDK APIs the decompiler knows about.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web assets
        run: tools/build_web.sh "$JAVA_HOME"

      - name: Smoke test under Pyodide
        working-directory: web
        run: |
          npm install --no-save "pyodide@${PYODIDE_VERSION}"
          mkdir -p /tmp/smoke
          javac -d /tmp/smoke test/*.java
          (cd /tmp/smoke && jar cf ../smoke.jar .)
          node ci-smoke.mjs /tmp/smoke.jar

      - name: Type-check published declarations
        run: web/test/types/check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: krakatau-web
          path: |
            web/public/*.mjs
            web/public/*.d.mts
            web/public/krakatau-cdn.d.ts
            web/public/index.html
            web/public/package.json
            web/public/LICENSE.TXT
            web/public/krakatau-py.zip
            web/public/jdk-stubs.jar

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krakatau-web
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version from tag
        working-directory: dist
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#web-v}"

      - name: Publish to npm
        working-directory: dist
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
        # If you use an npm token instead of trusted publishing, add:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Warm jsDelivr
        run: |
          v="${GITHUB_REF_NAME#web-v}"
          for f in krak-client.mjs krak.worker.mjs krak-core.mjs krakatau-py.zip jdk-stubs.jar; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://cdn.jsdelivr.net/npm/krakatau-web@${v}/${f}")
              [ "$code" = 200 ] && break
              sleep 20
            done
            echo "$f -> $code"
          done
